# BatchProducer Configuration File (Classpath Resource)
# This is a fallback configuration file loaded from classpath

# Batch Processing Settings
batch.size=100
batch.timeout=30000
batch.threads=4

# Output Settings
output.directory=./output
output.format=csv

# Error Handling
error.retry.count=3
error.retry.delay=5000

# Logging
log.level=INFO
log.file=./logs/batchproducer.log
